load_module modules/ngx_otel_module.so;

worker_processes auto;
error_log /dev/stderr warn;

events {}

http {
    # Where spans are exported (OTLP/gRPC). Nothing is listening here in this
    # 2-service setup, so you may see export warnings in the error log - they
    # are harmless; propagation and the $otel_* variables still work.
    otel_exporter {
        endpoint localhost:4317;
    }
    otel_service_name nginx-gateway;

    # Log the incoming header and the IDs nginx generated.
    # The traceparent nginx sends upstream is: 00-<otel_trace_id>-<otel_span_id>-<flags>
    log_format trace '[nginx] incoming_traceparent="$http_traceparent" '
                     'trace_id=$otel_trace_id span_id=$otel_span_id '
                     'parent_span_id=$otel_parent_id parent_sampled=$otel_parent_sampled '
                     '"$request" $status';
    access_log /dev/stdout trace;

    server {
        listen 80;

        location / {
            otel_trace on;
            otel_trace_context propagate;   # extract incoming traceparent (or start a new one) and inject it upstream

            add_header X-Trace-Id $otel_trace_id always;   # handy for curl -i

            proxy_pass http://app:8000;
        }
    }
}
